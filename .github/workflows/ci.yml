name: CI

# A execucao local equivalente (lint, typecheck, testes e build) foi
# validada na Sprint 1.5. O workflow remoto depende do GitHub configurado.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: "npm"

      - name: Guard against committed environment credentials
        run: |
          node --test scripts/guards/repository-env-guard.test.mjs
          node scripts/guards/repository-env-guard.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: homologacao-ficticia
    env:
      SUPABASE_TEST_HOMOLOGATION: ${{ secrets.SUPABASE_TEST_HOMOLOGATION }}
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_PROJECT_REF: ${{ vars.QA_SUPABASE_PROJECT_REF }}
      SUPABASE_TEST_ENVIRONMENT: homologation
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
      SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
      QA_SUPABASE_PROJECT_REF: ${{ vars.QA_SUPABASE_PROJECT_REF }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      DR_SUPABASE_PROJECT_REF: ${{ vars.DR_SUPABASE_PROJECT_REF }}
      VERCEL_PREVIEW_SUPABASE_PROJECT_REF: ${{ vars.VERCEL_PREVIEW_SUPABASE_PROJECT_REF }}
      VERCEL_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.VERCEL_PRODUCTION_SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Integration, RLS and Storage
        run: npm run test:integration
